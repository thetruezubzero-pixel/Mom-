<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>mom — primary / twin</title>
<style>
  :root {
    --bg: #f2f4f4;
    --surface: #ffffff;
    --surface-2: #e7eaea;
    --ink: #14181a;
    --ink-dim: #5b666b;
    --line: #d7dcdc;
    --primary: #2e8f89;
    --primary-ink: #ffffff;
    --twin: #8a55a6;
    --twin-ink: #ffffff;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --surface: #1d2225;
      --surface-2: #262c2f;
      --ink: #e8ecec;
      --ink-dim: #8b969b;
      --line: #33393c;
      --primary: #5fb8b3;
      --primary-ink: #0c1514;
      --twin: #b98bc9;
      --twin-ink: #1a1220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --surface: #1d2225;
    --surface-2: #262c2f;
    --ink: #e8ecec;
    --ink-dim: #8b969b;
    --line: #33393c;
    --primary: #5fb8b3;
    --primary-ink: #0c1514;
    --twin: #b98bc9;
    --twin-ink: #1a1220;
  }
  :root[data-theme="light"] {
    --bg: #f2f4f4;
    --surface: #ffffff;
    --surface-2: #e7eaea;
    --ink: #14181a;
    --ink-dim: #5b666b;
    --line: #d7dcdc;
    --primary: #2e8f89;
    --primary-ink: #ffffff;
    --twin: #8a55a6;
    --twin-ink: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  ::selection { background: var(--primary); color: var(--primary-ink); }

  header {
    flex: none;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  header .title {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  header .title small {
    color: var(--ink-dim);
    font-weight: 400;
  }
  header .legend {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--ink-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  header .legend span { display: flex; align-items: center; gap: 5px; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.primary { background: var(--primary); }
  .dot.twin { background: var(--twin); }

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  main::-webkit-scrollbar { display: none; }

  .hint {
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 2px;
  }
  .hint code {
    background: var(--surface-2);
    border-radius: 5px;
    padding: 1px 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }

  .exchange { display: flex; flex-direction: column; gap: 8px; }
  .input-echo {
    align-self: flex-end;
    max-width: 86%;
    background: var(--surface-2);
    color: var(--ink);
    border-radius: var(--radius);
    border-bottom-right-radius: 4px;
    padding: 9px 13px;
    font-size: 15px;
    line-height: 1.4;
  }
  .pair { display: flex; flex-direction: column; gap: 8px; }
  .card {
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    padding: 11px 13px;
    max-width: 92%;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .card .who {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .card.primary .who { color: var(--primary); }
  .card.twin .who { color: var(--twin); }
  .card .body {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .card .body .sub {
    display: block;
    margin-top: 6px;
    color: var(--ink-dim);
    font-size: 12px;
  }

  form#composer {
    flex: none;
    border-top: 1px solid var(--line);
    padding: 10px 12px max(10px, env(safe-area-inset-bottom));
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lenses {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .lenses::-webkit-scrollbar { display: none; }
  .lens-chip {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
  }
  .lens-chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea#field {
    flex: 1;
    resize: none;
    max-height: 110px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 11px 15px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.35;
  }
  textarea#field:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  button#send {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: var(--primary-ink);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button#send:active { opacity: 0.8; }
  button#send:focus-visible, .lens-chip:focus-visible, textarea#field:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .exchange { animation: rise 0.22s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<header>
  <div class="title">mom <small>/ primary + twin</small></div>
  <div class="legend">
    <span><i class="dot primary"></i>primary</span>
    <span><i class="dot twin"></i>twin</span>
  </div>
</header>

<main id="log">
  <div class="hint">
    Same tool as the CLI, running fully in this page — nothing leaves your phone.
    Pick a lens below, type something, and you'll get a <b>primary</b> and a <b>twin</b> read on it.
    Add this page to your Home Screen (Share → Add to Home Screen) to open it like an app.
  </div>
</main>

<form id="composer">
  <div class="lenses" id="lenses"></div>
  <div class="row">
    <textarea id="field" rows="1" placeholder="Type something…" autocapitalize="sentences"></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </div>
</form>

<script>
  // --- lib/lenses.js, ported line for line ---
  function literalLens(text) {
    return text.trim();
  }

  function patternLens(text) {
    const words = text
      .toLowerCase()
      .split(/\W+/)
      .filter(Boolean);

    const counts = new Map();
    for (const word of words) {
      counts.set(word, (counts.get(word) || 0) + 1);
    }

    const repeated = [...counts.entries()]
      .filter(([, count]) => count > 1)
      .sort((a, b) => b[1] - a[1])
      .map(([word, count]) => `${word} (${count}x)`);

    if (repeated.length === 0) {
      return `${text.trim()}\n  [no repeated terms detected]`;
    }
    return `${text.trim()}\n  [repeated terms: ${repeated.join(', ')}]`;
  }

  function metaphorLens(text) {
    const trimmed = text.trim();
    if (!trimmed) return trimmed;
    return `Treat "${trimmed}" as a landscape: what is the terrain, what is the weather, and what is the traveler looking for?`;
  }

  const lenses = {
    literal: literalLens,
    pattern: patternLens,
    metaphor: metaphorLens,
  };

  function listLenses() {
    return Object.keys(lenses);
  }

  function applyLens(name, text) {
    const lens = lenses[name];
    if (!lens) {
      throw new Error(`Unknown lens: ${name}. Available: ${listLenses().join(', ')}`);
    }
    return lens(text);
  }
  // --- end lib/lenses.js ---

  // --- lib/agents.js, ported line for line ---
  function primaryAgent(text, lensName) {
    const framed = applyLens(lensName, text);
    return {
      agent: 'primary',
      lens: lensName,
      text: framed,
    };
  }

  function twinAgent(text, lensName) {
    const framed = applyLens(lensName, text);
    const reversed = framed.split('').reverse().join('');
    return {
      agent: 'twin',
      lens: lensName,
      text: `${framed}\n  [twin counter-read: consider the inverse — ${reversed.slice(0, 60)}${reversed.length > 60 ? '...' : ''}]`,
    };
  }

  function respond(text, lensName) {
    return [primaryAgent(text, lensName), twinAgent(text, lensName)];
  }
  // --- end lib/agents.js ---

  const lensNames = listLenses();
  let currentLens = 'literal';

  const lensesEl = document.getElementById('lenses');
  lensNames.forEach((name) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'lens-chip';
    chip.textContent = name;
    chip.setAttribute('aria-pressed', name === currentLens ? 'true' : 'false');
    chip.addEventListener('click', () => {
      currentLens = name;
      [...lensesEl.children].forEach((c) => c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
      field.focus();
    });
    lensesEl.appendChild(chip);
  });

  const log = document.getElementById('log');
  const form = document.getElementById('composer');
  const field = document.getElementById('field');

  field.addEventListener('input', () => {
    field.style.height = 'auto';
    field.style.height = Math.min(field.scrollHeight, 110) + 'px';
  });

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function render(input, primary, twin) {
    const exchange = document.createElement('div');
    exchange.className = 'exchange';
    exchange.innerHTML = `
      <div class="input-echo">${escapeHTML(input)}</div>
      <div class="pair">
        <div class="card primary">
          <div class="who">primary · ${primary.lens}</div>
          <div class="body">${escapeHTML(primary.text)}</div>
        </div>
        <div class="card twin">
          <div class="who">twin · ${twin.lens}</div>
          <div class="body">${escapeHTML(twin.text)}</div>
        </div>
      </div>
    `;
    log.appendChild(exchange);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = field.value.trim();
    if (!value) return;
    const [primary, twin] = respond(value, currentLens);
    render(value, primary, twin);
    field.value = '';
    field.style.height = 'auto';
  });

  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
